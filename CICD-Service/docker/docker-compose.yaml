  #  volumes:
  #    - ./conf_files/config.ini:/app/config.ini
  #    - ./conf_files/testbeds_information.yaml:/app/static/testbeds_information.yaml

  results_repository:
    image: bogem/ftp
    container_name: ci-cd-results-repository
    ports:
      - "20:20"
      - "21:21"
      - "47400-47470:47400-47470"
    environment:
      - FTP_USER=ftp-user
      - FTP_PASS=ftp-password
      - PASV_ADDRESS=10.255.28.74
    volumes:
      - ./docker_data/ftp:/home/vsftpd

  db:
    image: postgres:latest
    container_name: ci-cd-postgres-db
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=5gasp
    volumes:
      - ./docker_data/data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: ci-cd-rabbitmq
    ports:
      # AMQP protocol
      - "5672:5672"
      # Management UI
      - "15672:15672" 
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin
    volumes:
      - ./docker_data/rabbitmq:/var/lib/rabbitmq
  
  redis:
    image: redis:latest
    container_name: ci-cd-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./docker_data/redis:/data