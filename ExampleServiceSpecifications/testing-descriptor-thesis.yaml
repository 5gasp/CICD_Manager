testcases:

  - testcase_id: 1
    type: predefined
    scope: dummy
    name: dummy_2MB_test
    description: Dummy 2MB test

execution:
  - batch_id: 1
    scope: dummy
    executions:
      - execution_id: 1
        name: dummy_tests
        testcase_ids: [1,1,1,1,1]